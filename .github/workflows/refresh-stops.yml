name: Refresh stops data

# Weekly refresh of transit data from the Israel MOT GTFS static feed:
# data/stops.json (all stops), data/routes.json + data/route_stops.json
# (bus-number search). If the feed can't be reached from the runner, the
# scripts exit 0 and the existing files are kept (committed only when
# something actually changed).

on:
  schedule:
    - cron: '0 3 * * 1'  # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild stops.json
        run: python scripts/build_stops.py

      - name: Rebuild routes data
        run: python scripts/build_routes.py

      - name: Commit if changed
        run: |
          git config user.name "bus-times-bot"
          git config user.email "bus-times-bot@users.noreply.github.com"
          git add data/stops.json data/routes.json data/route_stops.json
          git diff --staged --quiet || git commit -m "chore: refresh transit data"
          git push
